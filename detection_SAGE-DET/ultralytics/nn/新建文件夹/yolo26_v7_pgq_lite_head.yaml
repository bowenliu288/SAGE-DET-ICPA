# YOLO26 + CBDDownLite + P2-P4 Scale Reconstruction + P5SemanticGate
# Version: yolo26_v7_pgq_lite_head.yaml
#
# Main changes:
# 1. Replace backbone downsampling Conv layers with CBDDownLite.
# 2. Add P2 small-object detection scale.
# 3. Remove P5 detection head.
# 4. Preserve P5 semantic feature and use P5SemanticGate to enhance P2.
# 5. Final detection heads: PGLiteDetect(P2_enhanced, P3, P4).

# Parameters
nc: 1 # UAV; 如果你的 data.yaml 里已经是 nc=1，也会以 data.yaml 为准
end2end: True
reg_max: 1

scales:
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

# YOLO26 backbone with CBDDownLite
backbone:
  # [from, repeats, module, args]

  - [-1, 1, Conv, [64, 3, 2]]                 # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]                # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]         # 2-P2/4

  - [-1, 1, CBDDownLite, [256]]               # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]         # 4-P3/8

  - [-1, 1, CBDDownLite, [512]]               # 5-P4/16
  - [-1, 2, C3k2, [512, True]]                # 6-P4/16

  - [-1, 1, CBDDownLite, [1024]]              # 7-P5/32
  - [-1, 2, C3k2, [1024, True]]               # 8-P5/32

  - [-1, 1, SPPF, [1024, 5, 3, True]]         # 9-P5/32
  - [-1, 2, C2PSA, [1024]]                    # 10-P5 semantic feature


# YOLO26 head with P2-P4 reconstruction and P5SemanticGate
head:
  # ---------------- Top-down FPN ----------------
  # P5 -> P4
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 11
  - [[-1, 6], 1, Concat, [1]]                  # 12 cat backbone P4
  - [-1, 2, C3k2, [512, True]]                 # 13 fused P4

  # P4 -> P3
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 14
  - [[-1, 4], 1, Concat, [1]]                  # 15 cat backbone P3
  - [-1, 2, C3k2, [256, True]]                 # 16 fused P3

  # P3 -> P2
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 17
  - [[-1, 2], 1, Concat, [1]]                  # 18 cat backbone P2
  - [-1, 2, C3k2, [128, True]]                 # 19 P2/4-xsmall

  # ---------------- Bottom-up PAN ----------------
  # P2 -> P3
  - [-1, 1, CBDDownLite, [128, 3, 2]]                 # 20
  - [[-1, 16], 1, Concat, [1]]                 # 21 cat fused P3
  - [-1, 2, C3k2, [256, True]]                 # 22 P3/8-small

  # P3 -> P4
  - [-1, 1, CBDDownLite, [256, 3, 2]]                 # 23
  - [[-1, 13], 1, Concat, [1]]                 # 24 cat fused P4
  - [-1, 2, C3k2, [512, True]]                 # 25 P4/16-medium

  # ---------------- P5 Semantic Gate ----------------
  # Input: [P2 feature, P5 semantic feature]
  # P2 = layer 19
  # P5 semantic feature = layer 10
  # Output: P2_enhanced
  - [[19, 10], 1, P5SemanticGate, []]          # 26 P2 enhanced by P5 semantic guidance

  # ---------------- Detect ----------------
  # P5 detection head is removed.
  # Detect only P2_enhanced, P3, P4.
  - [[26, 22, 25], 1, PGLiteDetect, [nc]]        # 27 PGLiteDetect(P2_enhanced, P3, P4)